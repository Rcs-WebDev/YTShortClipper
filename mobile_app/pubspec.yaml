name: yt_short_clipper_mobile
description: "AI-Powered YouTube Short Clipper with Pre-Render Video Studio Editor for Android"
publish_to: "none"
version: 1.0.7+8

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0

  # Video Playback & Preview
  video_player: ^2.8.6
  chewie: ^1.8.1

  # YouTube Downloader & Metadata
  youtube_explode_dart: ^2.2.1

  # Local On-Device Video Rendering (FFmpeg for Android)
  ffmpeg_kit_flutter_new: ^4.6.7

  # Network & AI APIs
  http: ^1.2.1
  dio: ^5.4.3+1

  # File & Storage
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  gallery_saver_plus: ^3.0.3
  image_picker: ^1.1.2
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  sherpa_onnx: ^1.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_foundation: 2.3.2

flutter:
  uses-material-design: true
